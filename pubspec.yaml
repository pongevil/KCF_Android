name: bs_mobile
description: "BS-Mobile — Flutter WMS mobile client (pragmatic feature-first)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.3 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  bot_toast: ^4.1.3
  bloc: ^9.1.1
  connectivity_plus: ^7.1.1
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  meta: ^1.16.0
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  intl: ^0.20.2
  open_file: ^3.5.11
  camera: ^0.12.0+1
  google_mlkit_barcode_scanning: ^0.15.0
  sqflite: ^2.4.2+1
  get_it: ^9.2.1
  path_provider: ^2.1.6
  go_router: ^17.3.0
  excel: ^4.0.6
  csv: ^8.0.0
  # 11.x pins win32 ^5 and breaks with plus packages (win32 ^6).
  # 12.x (win32 ^6) is not on pub.dev yet — pin upstream until stable release.
  file_picker:
    git:
      url: https://github.com/miguelpruivo/flutter_file_picker.git
      ref: 2ba94f8266e5062b0813d75949fc9d5c772e14ca
  share_plus: ^13.3.0
  # 3.3.0 stays on archive 3.x, which is required by excel 4.0.6.
  lottie: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - lib/src/global/mockdata/app_config_mock.json
    - lib/src/global/mockdata/locale_resources_mock.json
    - lib/src/global/mockdata/menu.json
    - lib/src/global/mockdata/barcode_format_all_mock.json
  fonts:
    - family: Noto
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
    - family: Noto-Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
        - asset: assets/fonts/NotoSansThai-Light.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
